# Live smoke against a real model: One Code drives the bash tool (Git Bash on
# Windows) and the PowerShell tool end to end on windows-latest, and the bash
# tool on ubuntu-latest, through `test/e2e/live-smoke.mjs`
# (docs/features/windows/ Phase 3 item 7; docs/features/linux/ Phase 1). Needs
# the OPEN_ROUTER_API_KEY repository secret; the default model is the cheap
# one used for testing. Runs on demand and when the shell-facing code changes
# on master — never in the unit-test matrix (ci.yml), which stays key-free.
name: Live smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "provider/model id to drive"
        type: string
        default: openrouter/deepseek/deepseek-v4.1-flash
  push:
    branches: [master]
    paths:
      - "extensions/bash/**"
      - "extensions/powershell/**"
      - "extensions/lib/shell-*.ts"
      - "extensions/lib/process-tree.ts"
      - "extensions/lib/paths.ts"
      - "extensions/auto-mode/**"
      - "extensions/permissions/**"
      - "test/e2e/live-smoke.mjs"
      - ".github/workflows/live-smoke.yml"

jobs:
  smoke:
    name: ${{ matrix.os }} (${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: bash }
          - { os: windows-latest, shell: powershell }
          - { os: ubuntu-latest, shell: bash }
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drive the ${{ matrix.shell }} tool live
        run: node test/e2e/live-smoke.mjs --shell ${{ matrix.shell }} --model "${{ inputs.model || 'openrouter/deepseek/deepseek-v4.1-flash' }}"
